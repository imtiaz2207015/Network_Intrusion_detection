services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - alert
      - analytics
      - frontend

  frontend:
    build: ./frontend
    restart: unless-stopped

  auth:
    build: ./auth-service
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SMTP_USER=${SMTP_USER}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${FRONTEND_URL:-http://localhost:8088}}
      - FRONTEND_URL=${PUBLIC_BASE_URL:-${FRONTEND_URL:-http://localhost:8088}}
      - TEST_AUTO_VERIFY=${TEST_AUTO_VERIFY:-false}
    depends_on:
      db:
        condition: service_healthy

  alert:
    build: ./alert-service
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SENSOR_KEY=${SENSOR_KEY}
      - LEGACY_OWNER_EMAIL=${LEGACY_OWNER_EMAIL:-}
      - SENSOR_OFFLINE_SECONDS=${SENSOR_OFFLINE_SECONDS:-120}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_MODEL=${AI_MODEL:-claude-haiku-5-5}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - CHAT_DAILY_LIMIT=${CHAT_DAILY_LIMIT:-20}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-1500}
      - MODEL_PATH=${MODEL_PATH:-/app/models/selected_features_model.pkl}
      - SENSOR_TZ=${SENSOR_TZ:-Asia/Dhaka}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/alerts_db
      - SMTP_USER=${SMTP_USER}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${FRONTEND_URL:-http://localhost:8088}}
      - FRONTEND_URL=${PUBLIC_BASE_URL:-${FRONTEND_URL:-http://localhost:8088}}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - EMAIL_COOLDOWN=${EMAIL_COOLDOWN:-300}
    volumes:
      - ../MachineLearningCVE/selected_features_model.pkl:/app/models/selected_features_model.pkl:ro
    depends_on:
      db:
        condition: service_healthy

  analytics:
    build: ./analytics-service
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/alerts_db
      - SENSOR_TZ=${SENSOR_TZ:-Asia/Dhaka}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
