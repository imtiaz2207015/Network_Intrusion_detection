services:
  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - alert
      - frontend

  frontend:
    build: ./frontend

  auth:
    build: ./auth-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth_data:/data

  alert:
    build: ./alert-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SENSOR_KEY=${SENSOR_KEY}
    volumes:
      - alert_data:/data

volumes:
  auth_data:
  alert_data:
