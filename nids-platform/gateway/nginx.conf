events {}
http {
  server_tokens off;
  client_max_body_size 1m;

  # rate limit zones (per client IP)
  limit_req_zone $binary_remote_addr zone=login:10m    rate=10r/m;
  limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=reset:10m    rate=3r/m;
  limit_req_zone $binary_remote_addr zone=ingest:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/s;
  limit_req_status 429;

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- auth: strict limits on sensitive endpoints ----
    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://auth:5001/login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/auth/google {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://auth:5001/google;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/auth/register {
      limit_req zone=register burst=5 nodelay;
      proxy_pass http://auth:5001/register;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/auth/forgot-password {
      limit_req zone=reset burst=3 nodelay;
      proxy_pass http://auth:5001/forgot-password;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/auth/reset-password {
      limit_req zone=reset burst=3 nodelay;
      proxy_pass http://auth:5001/reset-password;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- auth: everything else ----
    location /api/auth/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://auth:5001/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- alerts: sensor ingest allows bursts ----
    location = /api/alerts/ingest {
      limit_req zone=ingest burst=100 nodelay;
      proxy_pass http://alert:5002/ingest;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/alerts/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://alert:5002/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/analytics/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://analytics:5003/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- frontend ----
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
    }
  }
}